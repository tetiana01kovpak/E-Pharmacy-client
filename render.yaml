# Render Blueprint: deploys both the API and the client SPA under one project.
#
# The CLIENT_ORIGIN / VITE_API_BASE_URL values below assume Render grants the
# exact service names below (e-pharmacy-server / e-pharmacy-client), giving
# URLs https://e-pharmacy-server.onrender.com and https://e-pharmacy-client.onrender.com.
# If a name is already taken, Render will suffix the slug instead (e.g. -a1b2) —
# in that case update the corresponding env var below (or in the dashboard) to
# match the real assigned URL and redeploy.
services:
  - type: web
    name: e-pharmacy-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: CLIENT_ORIGIN
        value: https://e-pharmacy-client.onrender.com

  - type: web
    name: e-pharmacy-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://e-pharmacy-server-e5w5.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
